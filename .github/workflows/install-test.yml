name: Installation tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Fresh install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bash syntax and whitespace
        run: |
          for script in ./*.sh tests/*.sh; do bash -n "$script"; done
          git diff --check
      - name: Download integrity regression
        run: sudo bash tests/download-integrity.sh
      - name: Real installation and missing-jq repair
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT bash tests/github-install.sh
      - name: Config generation regression
        run: sudo bash tests/fresh-config.sh
      - name: Offline export regression
        run: sudo bash test-local.sh
      - name: Stop test service
        if: always()
        run: sudo systemctl stop sing-box.service || true
